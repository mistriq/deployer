openapi: 3.1.0
info:
  title: Light Apps Hosting workload-secret broker contract
  version: v1
  description: >
    Private boundary implemented by the hosting control plane and called only
    by dedicated Deployer hosting agents. The broker validates a short-lived,
    lease-bound Deployer workload identity and returns plaintext only to the
    claiming dedicated hosting-agent process. Plaintext is handled only by this
    control-plane secret-broker subsystem and the assigned agent/runtime; it
    bypasses the Deployer server, database, build storage, logs, callbacks,
    Docker arguments, and images.
servers:
  - url: https://hosting-control.internal.example
    description: Fixed private broker origin configured on every hosting agent
paths:
  /api/internal/v1/workload-secrets/redeem:
    post:
      summary: Redeem the exact secret-reference set for one current workload lease
      operationId: redeemWorkloadSecrets
      security: [{workloadIdentityBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SecretRedemptionRequest"}
      responses:
        "200":
          description: >
            Exact named secret set. The response must be application/json, at
            most 1 MiB, contain no unknown fields, and must not be cached.
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecretRedemptionResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "408": {$ref: "#/components/responses/Error"}
        "409":
          description: The token_id has already been redeemed or is concurrently in use.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    workloadIdentityBearer:
      type: http
      scheme: bearer
      bearerFormat: wli_v1
      x-token-claims: {$ref: "#/components/schemas/WorkloadIdentityClaims"}
      description: >
        Token format is wli_<base64url-json>.<base64url-hmac>. Verify
        HMAC-SHA256 over the encoded JSON segment with a key of at least 32
        random bytes. Decode and validate WorkloadIdentityClaims. Require
        version=v1, issuer=deployer,
        audience=light-apps-hosting-secret-broker, issued_at not in the future,
        expires_at not expired and no more than 90 seconds after issued_at,
        a unique 128-bit token_id, positive runner_id/work_id/lease_generation,
        operation build or restore, valid external identities, and an exact
        secret_references_digest match. Consume token_id atomically and reject
        replay. During signing-key rotation the broker accepts current and
        previous keys for at least 90 seconds while Deployer signs only with
        the current key.
  schemas:
    WorkloadIdentityClaims:
      type: object
      additionalProperties: false
      required: [version, issuer, audience, token_id, runner_id, work_id, lease_generation, operation, external_project_id, external_deployment_id, secret_references_digest, issued_at, expires_at]
      properties:
        version: {type: string, const: v1}
        issuer: {type: string, const: deployer}
        audience: {type: string, const: light-apps-hosting-secret-broker}
        token_id: {type: string, pattern: '^[a-f0-9]{32}$', description: Random 128-bit identifier encoded as lowercase hexadecimal.}
        runner_id: {type: integer, format: int64, minimum: 1}
        work_id: {type: integer, format: int64, minimum: 1}
        lease_generation: {type: integer, format: int64, minimum: 1}
        operation: {type: string, enum: [build, restore]}
        external_project_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'}
        external_deployment_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'}
        secret_references_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        issued_at: {type: integer, format: int64, description: UTC Unix timestamp in whole seconds.}
        expires_at:
          type: integer
          format: int64
          description: UTC Unix timestamp in whole seconds; at most 90 seconds after issued_at and never later than the authenticated Deployer lease expiry.
    SecretReference:
      type: object
      additionalProperties: false
      required: [provider, reference, name, expires_at]
      properties:
        provider: {type: string, const: control-plane}
        reference:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^[A-Za-z0-9._:/-]+$'
        name: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
        expires_at: {type: string, format: date-time}
    SecretRedemptionRequest:
      type: object
      additionalProperties: false
      required: [secret_references]
      properties:
        secret_references:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: "#/components/schemas/SecretReference"}
      description: >
        To verify secret_references_digest, preserve array order and serialize a
        compact UTF-8 JSON array with no whitespace. Every object has fields in
        exactly this order: provider, reference, name, expires_at. Encode each
        expires_at in UTC using RFC 3339 with only necessary fractional-second
        digits (Go time.RFC3339Nano form). The allowed values are ASCII and need
        no JSON escaping. Hash those exact bytes with SHA-256 and prefix the
        lowercase hexadecimal digest with sha256:. References are sensitive
        metadata. expires_at was checked at deployment admission; the current
        workload identity authorizes build or later restore redemption.
    SecretValue:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
        value:
          type: string
          minLength: 1
          writeOnly: true
          description: UTF-8 value whose encoded byte length is at most 65536 bytes.
    SecretRedemptionResponse:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: "#/components/schemas/SecretValue"}
      description: >
        Names must be unique and exactly equal the requested names. Aggregate
        plaintext is limited to 256 KiB. Never log, trace, persist, or include
        Authorization, request references, or response values in errors.
        On an ambiguous network error, 408, 409, 429, 5xx, or truncated/invalid
        successful JSON result, the agent requests a new workload identity and
        retries with a new token_id; it never replays a consumed token.
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_identity, identity_expired, identity_replayed, reference_unavailable, rate_limited, internal_error, unavailable]
        message: {type: string, description: Redacted operator context.}
  responses:
    Error:
      description: Stable JSON error; clients must branch on code rather than message.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
