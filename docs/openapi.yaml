          description: Non-cacheable restore identity bound to this lease and the exact secret-reference digest.
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HostingWorkloadIdentity"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/recoveries/{hostingRecoveryId}/logs:
    post:
      tags: [hosting-agent]
      summary: Persist a bounded redacted runtime-recovery log chunk
