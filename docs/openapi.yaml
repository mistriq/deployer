        "403": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/recoveries/{hostingRecoveryId}/workload-identity:
    post:
      tags: [hosting-agent]
      summary: Mint a fresh secret-broker identity for the current recovery lease
      operationId: mintHostingRecoveryWorkloadIdentity
      security: [{hostingAgentBearerAuth: []}]
