      responses:
        "200":
          description: Log accepted.
        "403":
          $ref: "#/components/responses/Error"

  /api/agent/complete/{buildId}:
    post:
      tags: [agent]
      summary: Complete a runner job
      operationId: completeAgentJob
      security:
        - agentBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuildId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [success, failed]
                error:
                  type: string
            examples:
              success:
                value:
                  status: success
                  error: ""
              failure:
                value:
                  status: failed
                  error: health check failed
      responses:
        "200":
