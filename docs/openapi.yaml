openapi: 3.1.0
info:
  title: Deployer API
  version: v1
  description: >
    Machine-readable reference for the Deployer admin API and runner agent API.
    Admin routes are intended to be protected by an upstream authorization
    gateway; Deployer does not implement local admin password login. Browser
    write requests also send X-Deployer-CSRF: "1". Agent routes use bearer
    tokens created through the runner API. Private control-plane routes use
    scoped Deployer service tokens and are not customer-facing endpoints.
servers:
  - url: https://deployer.example.com
    description: Example production URL
  - url: http://127.0.0.1:9090
    description: Default local URL
x-outbound-contracts:
  hostingSourceBroker:
    contract: ./source-broker-openapi.yaml
    description: >
      Deployer redeems each opaque source reference with an authenticated POST
      to the configured broker path /api/internal/v1/source-artifacts/redeem.
      It sends and requires an exact response echo of
      X-Deployer-Repository-Installation-Id, X-Deployer-Repository-Id,
      X-Deployer-Repository-Full-Name, X-Deployer-Commit-Sha, and
      X-Deployer-Artifact-Digest. A successful response is application/x-tar
      with Content-Length. Redirects, identity disagreement, digest
      disagreement, expired references, and configured size-limit violations
      fail before deployment state or runner capacity is created. Exact
      successful idempotency replays do not redeem again and remain valid after
      the source reference expires.
  hostingSecretBroker:
    contract: ./secret-broker-openapi.yaml
    description: >
      Immediately before a Node runtime starts, a secret-capable hosting agent
      obtains a lease-bound identity valid for at most 90 seconds and redeems
      the deployment's opaque references directly against the fixed broker
      origin. It accepts one bounded application/json response, writes the exact
      named set into host tmpfs, and mounts it read-only at
      /run/secrets/deployer. The control-plane broker subsystem and assigned
      agent/runtime handle plaintext; it bypasses the Deployer server, database,
      build pipeline, logs, callbacks, Docker arguments, and images.

tags:
  - name: capabilities
  - name: projects
  - name: builds
  - name: runners
  - name: agent
  - name: release
  - name: service-tokens
  - name: internal
  - name: hosting-agent

paths:
  /api/capabilities:
    get:
      tags: [capabilities]
      summary: Describe supported API capabilities
      operationId: getCapabilities
      responses:
        "200":
          description: Supported modes, versions, features, and limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /api/projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      responses:
        "200":
          description: Projects with their latest build when available.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      summary: Create a project
      operationId: createProject
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
            examples:
              filesProject:
                summary: Files-mode project
                value:
                  name: Dashboard
                  repo_path: /srv/repos/dashboard
                  deploy_dir: /srv/apps/dashboard
                  deploy_mode: files
                  runner_id: 1
                  preserve: uploads,.env
                  permissions: '{"owner":"www-data:www-data","dirs":{"storage":"0750"}}'
              dockerProject:
                summary: Docker-mode project
                value:
                  name: API
                  repo_path: /srv/repos/api
                  dockerfile_path: Dockerfile
                  compose_file: docker-compose.yml
                  compose_services: app worker
                  image_name: registry.example.com/api
                  deploy_dir: /srv/apps/api
                  deploy_mode: docker
                  runner_id: 1
                  health_url: https://api.example.com/health
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"

  /api/projects/import:
    post:
      tags: [projects]
      summary: Import a project from a public-safe export envelope
      operationId: importProject
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectExport"
      responses:
        "201":
          description: Imported project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      summary: Get a project
      operationId: getProject
      responses:
        "200":
          description: Project details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [projects]
      summary: Update a project
      operationId: updateProject
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [projects]
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Project deleted.

  /api/projects/{projectId}/summary:
    get:
      tags: [projects]
      summary: Get an AI-focused project summary
      operationId: getProjectSummary
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Compact project state for agents and API clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
              examples:
                summary:
                  value:
                    project:
                      id: 1
                      name: Dashboard
                      repo_path: /srv/repos/dashboard
                      deploy_dir: /srv/apps/dashboard
                      deploy_mode: files
                      runner_id: 1
                      created_at: "2026-06-16T12:00:00Z"
                    runner:
                      id: 1
                      name: production-vps
                      labels: linux,docker
                      status: offline
                      created_at: "2026-06-16T12:00:00Z"
                    last_build:
                      id: 42
                      project_id: 1
                      status: failed
                      started_at: "2026-06-16T12:10:00Z"
                      finished_at: "2026-06-16T12:11:00Z"
                      duration_seconds: 60
                      error_message: health check failed
                      triggered_by: manual
                    recent_failures:
                      - id: 42
                        project_id: 1
                        status: failed
                        started_at: "2026-06-16T12:10:00Z"
                        finished_at: "2026-06-16T12:11:00Z"
                        duration_seconds: 60
                        error_message: health check failed
                        triggered_by: manual
                    recommended_actions:
                      - Runner is offline; check the agent service and runner token before deploying.
                      - Last build failed; inspect the build log and error message before redeploying.
        "404":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/export:
    get:
      tags: [projects]
      summary: Export a project with secrets and runtime bindings omitted
      operationId: exportProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Public-safe project export envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExport"
        "404":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/history:
    get:
      tags: [projects, builds]
      summary: Summarize recent build duration and status history for a project
      operationId: getProjectBuildHistory
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Recent project build history for charts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildHistory"
        "404":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/clone:
    post:
      tags: [projects]
      summary: Clone a project configuration without copying build history
      operationId: cloneProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCloneInput"
            examples:
              namedClone:
                value:
                  name: Dashboard Staging
      responses:
        "201":
          description: Cloned project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/preview:
    get:
      tags: [projects]
      summary: Preview planned deployment actions without starting a build
      operationId: previewProjectDeploy
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Read-only deploy plan for the current project configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployPreview"
              examples:
                dockerAgentPreview:
                  value:
                    project_id: 1
                    project_name: Dashboard
                    repo_path: /srv/repos/dashboard
                    commit_sha: abc1234
                    deploy_mode: docker
                    transport: agent
                    runner:
                      id: 1
                      name: production-vps
                      labels: linux,docker
                      status: online
                      last_seen: "2026-06-16T12:00:00Z"
                      created_at: "2026-06-16T11:00:00Z"
                    deploy_dir: /srv/apps/dashboard
                    hooks:
                      git_pull_before_build: true
                      post_deploy: echo migrated
                      post_deploy_enabled: true
                    health_check:
                      enabled: true
                      url: https://dashboard.example.com/health
                      timeout: 60s
                    expected_artifact:
                      type: docker_image_tar
                      extension: .tar
                      server_managed: true
                    planned_steps:
                      - git_pull
                      - get_commit_sha
                      - docker_build
                      - docker_save
                      - create_agent_job
                      - wait_for_agent
                    warnings: []
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/runbook:
    get:
      tags: [projects]
      summary: Generate an AI-focused operational runbook for a project
      operationId: getProjectRunbook
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Deterministic deploy and recovery runbook generated from project configuration and recent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRunbook"
              examples:
                filesRunbook:
                  value:
                    project_id: 1
                    project_name: Dashboard
                    deploy_mode: files
                    how_to_deploy:
                      - Review the deploy preview for the current commit and planned artifact.
                      - The server packages repository files into a tar.gz archive.
                      - The assigned runner downloads the archive, extracts it into deploy_dir, restores preserve paths, applies permissions, and runs post_deploy if configured.
                      - Watch the build log stream or structured build events until the build reaches a terminal status.
                    important_files:
                      - /srv/repos/dashboard
                      - .deployignore or .dockerignore
                      - /srv/apps/dashboard
                      - preserve:uploads
                    runner:
                      id: 1
                      name: production-vps
                      labels: linux
                      status: offline
                      created_at: "2026-06-16T11:00:00Z"
                    rollback:
                      supported: false
                      notes:
                        - Automatic file rollback is not implemented; take a snapshot before risky deploys and restore files manually if needed.
                    failure_recovery:
                      - Open the latest failed build and inspect the failure summary plus structured build events.
                      - The runner is offline; check the agent service, network path, and runner token.
                    operational_notes:
                      - "Deploy preview transport: agent"
                      - "Expected artifact type: files_archive"
        "404":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/autodetect:
    get:
      tags: [projects]
      summary: Detect repository deploy signals
      operationId: autodetectProjectRepo
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Detected Docker, Compose, package manager, ignore-file, and likely deploy-mode signals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoAutodetect"
              examples:
                dockerRepo:
                  value:
                    project_id: 1
                    repo_path: /srv/repos/dashboard
                    dockerfiles:
                      - Dockerfile
                    compose_files:
                      - compose.yaml
                    package_managers:
                      - npm
                      - go
                    ignore_file: .deployignore
                    likely_deploy_mode: docker
                    suggested_fields:
                      deploy_mode: docker
                      dockerfile_path: Dockerfile
                      compose_file: compose.yaml
                    warnings: []
        "404":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/deploy:
    post:
      tags: [projects, builds]
      summary: Trigger a deployment
      operationId: deployProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Deployment build was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildCreated"
              examples:
                deployStarted:
                  value:
                    build_id: 42
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/projects/{projectId}/snapshot:
    post:
      tags: [projects, builds]
      summary: Request a remote snapshot from a runner
      operationId: snapshotProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Snapshot build was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildCreated"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}:
    parameters:
      - $ref: "#/components/parameters/BuildId"
    get:
      tags: [builds]
      summary: Get a build
      operationId: getBuild
      responses:
        "200":
          description: Build details and persisted log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Build"
        "404":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}/stream:
    get:
      tags: [builds]
      summary: Watch live build logs
      operationId: streamBuildLogs
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Server-sent events containing build log lines and close events.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                logEvent:
                  summary: Build log event
                  value: |
                    event: log
                    data: Building image

                    event: close
                    data: done

  /api/builds/{buildId}/events:
    get:
      tags: [builds]
      summary: Get structured JSON events for a build
      operationId: getBuildEvents
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Parsed build steps, durations, terminal status, and job metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildEvents"
              examples:
                failedStep:
                  value:
                    build_id: 42
                    project_id: 1
                    status: failed
                    triggered_by: manual
                    commit_sha: abc1234
                    job_id: 9
                    runner_id: 1
                    artifact_id: job-9-artifact
                    artifact_available: true
                    events:
                      - sequence: 1
                        type: step_started
                        step: Docker Build
                        status: running
                      - sequence: 2
                        type: log
                        step: Docker Build
                        message: Building image
                      - sequence: 3
                        type: step_finished
                        step: Docker Build
                        status: completed
                        duration_seconds: 12
                      - sequence: 4
                        type: step_failed
                        step: health check
                        status: failed
                        error: health check failed
                      - sequence: 5
                        type: build_finished
                        status: failed
                        error: "health check: health check failed"
        "404":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}/failure-summary:
    get:
      tags: [builds]
      summary: Summarize a failed build
      operationId: getBuildFailureSummary
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Deterministic failure summary derived from persisted build logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildFailureSummary"
              examples:
                healthFailure:
                  value:
                    build_id: 42
                    project_id: 1
                    status: failed
                    has_failure: true
                    failed_step: health check
                    likely_cause: health URL not responding
                    relevant_log_lines:
                      - Checking https://dashboard.example.com/health
                      - "curl: failed to connect"
                      - "FAILED at step 'health check': health URL not responding"
                    suggested_fix: Check the configured health endpoint or container health status, then review the service logs on the target host.
                    error_message: "health check: health URL not responding"
        "404":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}/release-notes:
    get:
      tags: [builds, release]
      summary: Generate release notes from Git commits between this and the previous build
      operationId: getBuildReleaseNotes
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Commit metadata for the selected build range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildReleaseNotes"
              examples:
                commitRange:
                  value:
                    build_id: 42
                    project_id: 1
                    project_name: Dashboard
                    previous_build_id: 41
                    previous_commit: abc1234
                    current_commit: def5678
                    compare_range: abc1234..def5678
                    commits:
                      - hash: def56789abcdef
                        short_hash: def5678
                        author_name: Release Bot
                        author_email: release@example.com
                        authored_at: "2026-06-16T12:10:00Z"
                        subject: Update health check endpoint
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}/annotations:
    get:
      tags: [builds]
      summary: List build annotations
      operationId: listBuildAnnotations
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Notes attached to this build.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BuildAnnotation"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [builds]
      summary: Create a build annotation
      operationId: createBuildAnnotation
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildAnnotationInput"
            examples:
              rollbackCandidate:
                value:
                  note: rollback candidate
      responses:
        "201":
          description: Created annotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildAnnotation"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}/annotations/{annotationId}:
    delete:
      tags: [builds]
      summary: Delete a build annotation
      operationId: deleteBuildAnnotation
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/AnnotationId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Annotation deleted.
        "404":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}/cancel:
    post:
      tags: [builds]
      summary: Cancel a running build
      operationId: cancelBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Build cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                cancelled:
                  value:
                    status: cancelled
        "400":
          $ref: "#/components/responses/Error"

  /api/builds/{buildId}/artifact:
    get:
      tags: [builds]
      summary: Download a completed snapshot artifact
      operationId: downloadBuildArtifact
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Snapshot tarball.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

  /api/runners:
    get:
      tags: [runners]
      summary: List runners
      operationId: listRunners
      responses:
        "200":
          description: Runners without token values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Runner"
    post:
      tags: [runners]
      summary: Create a runner
      operationId: createRunner
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerInput"
            examples:
              createRunner:
                value:
                  name: production-vps
                  labels: linux,docker
      responses:
        "201":
          description: Created runner. The token is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
              examples:
                runnerCreated:
                  value:
                    id: 1
                    name: production-vps
                    token: dep_1234567890_example
                    labels: linux,docker
                    status: offline
                    created_at: "2026-06-16T12:00:00Z"
        "400":
          $ref: "#/components/responses/Error"

  /api/runners/{runnerId}:
    parameters:
      - $ref: "#/components/parameters/RunnerId"
    get:
      tags: [runners]
      summary: Get a runner
      operationId: getRunner
      responses:
        "200":
          description: Runner details without token value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [runners]
      summary: Delete a runner
      operationId: deleteRunner
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Runner deleted.

  /api/runners/{runnerId}/rotate:
    post:
      tags: [runners]
      summary: Rotate a runner token
      operationId: rotateRunnerToken
      parameters:
        - $ref: "#/components/parameters/RunnerId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Runner with newly issued token. The token is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
              examples:
                tokenRotated:
                  value:
                    id: 1
                    name: production-vps
                    token: dep_rotated_1234567890_example
                    labels: linux,docker
                    status: online
                    last_seen: "2026-06-16T12:05:00Z"
                    created_at: "2026-06-16T12:00:00Z"
        "404":
          $ref: "#/components/responses/Error"

  /api/runners/{runnerId}/history:
    get:
      tags: [runners, builds]
      summary: Summarize recent build duration and status history for a runner
      operationId: getRunnerBuildHistory
      parameters:
        - $ref: "#/components/parameters/RunnerId"
      responses:
        "200":
          description: Recent runner build history for charts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildHistory"
        "404":
          $ref: "#/components/responses/Error"

  /api/service-tokens:
    get:
      tags: [service-tokens]
      summary: List service tokens without their secret values
      operationId: listServiceTokens
      responses:
        "200":
          description: Service token metadata.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Pragma:
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceTokenMetadata"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [service-tokens]
      summary: Create a scoped service token
