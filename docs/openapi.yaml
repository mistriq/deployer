          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id: {type: string, pattern: '^[a-f0-9]{48}$'}
      responses:
        "200":
          description: Authoritative bounded retention set for a session durably tombstoned during takeover.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HostingHeartbeatResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/poll:
    post:
      tags: [hosting-agent]
      summary: Atomically claim one job assigned to this hosting runner
      operationId: pollHostingAgent
      security: [{hostingAgentBearerAuth: []}]
      responses:
        "200":
          description: Lease-bound generated workload recipe and opaque secret references.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HostingClaimedJob"}
        "204": {description: No assigned job is available.}
        "401": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/jobs/{hostingJobId}/source:
    get:
      tags: [hosting-agent]
      summary: Download the exact immutable source archive for the current lease
      operationId: downloadHostingSource
      security: [{hostingAgentBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/HostingJobId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
      responses:
        "200":
          description: Git archive whose SHA-256 is the recipe artifact digest.
