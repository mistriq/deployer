      summary: Download the retained immutable release image for a current recovery lease
      operationId: downloadHostingRecoveryArtifact
      security: [{hostingAgentBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/HostingRecoveryId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
      responses:
        "200":
          description: Docker image archive whose SHA-256 is the restore recipe release artifact digest.
          headers:
            X-Deployer-Artifact-Digest:
              schema: {$ref: "#/components/schemas/SHA256Digest"}
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/recoveries/{hostingRecoveryId}/heartbeat:
    post:
      tags: [hosting-agent]
      summary: Renew a current runtime-recovery lease and receive cancellation intent
      operationId: heartbeatHostingRecovery
      security: [{hostingAgentBearerAuth: []}]
