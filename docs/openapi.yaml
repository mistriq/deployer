      parameters:
        - $ref: "#/components/parameters/HostingRecoveryId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HostingRecoveryCompletion"}
      responses:
        "204":
          description: Recovery completion accepted; an identical same-lease replay, including a retryable failure, is idempotent.
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}

  /api/agent/poll:
