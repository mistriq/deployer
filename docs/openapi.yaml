  /api/agent/heartbeat:
    post:
      tags: [agent]
      summary: Update runner heartbeat
      operationId: heartbeatAgent
      security:
        - agentBearerAuth: []
      responses:
        "200":
          description: Heartbeat accepted.
        "401":
          $ref: "#/components/responses/Error"

  /api/version:
    get:
      tags: [release]
      summary: Get server binary version and checksum
      operationId: getVersion
      responses:
        "200":
          description: Version metadata.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                  checksum_sha256:
                    type: string

  /download/deployer:
    get:
      tags: [release]
      summary: Download the server binary for agent auto-update
      operationId: downloadDeployerBinary
      responses:
        "200":
          description: Deployer binary.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

webhooks:
  hostingTerminal:
    post:
      tags: [internal]
      summary: Signed at-least-once terminal hosting callback
      description: >
        Deployer signs "<timestamp>.<event_id>.<raw body>" with HMAC-SHA256.
        Receivers MUST reject timestamps outside a five-minute window, compare
        signatures in constant time, and deduplicate X-Deployer-Event-ID. A 2xx
        response acknowledges delivery. Non-2xx and network failures retry with
        bounded exponential backoff and may reach dead_letter. Poll the deployment
        endpoint to reconcile any missed callback.
      parameters:
        - name: X-Deployer-Timestamp
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9]+$'}
        - name: X-Deployer-Event-ID
          in: header
          required: true
          schema: {type: string, pattern: '^evt_[a-f0-9]{32}$'}
        - name: X-Deployer-Signature
          in: header
          required: true
          schema: {type: string, pattern: '^sha256=[a-f0-9]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HostingCallback"}
      responses:
        "204": {description: Callback accepted or already processed.}

components:
  securitySchemes:
    agentBearerAuth:
      type: http
      scheme: bearer
    serviceBearerAuth:
      type: http
      scheme: bearer
      description: Hashed scoped service token. Supported scopes are deployments:read, deployments:write, projects:write, and hosting:admin.
    hostingAgentBearerAuth:
      type: http
      scheme: bearer
      description: Dedicated hashed hosting-runner credential; never interchangeable with a legacy runner or service token.

  headers:
    IdempotencyReplayed:
      description: Present with value `true` only when this response replays a previously completed success or terminal error.
      schema:
        type: string
        enum: ["true"]

  parameters:
    CSRFHeader:
      name: X-Deployer-CSRF
      in: header
      required: true
      schema:
        type: string
        enum: ["1"]
      description: Required for state-changing browser/admin API requests.
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AnnotationId:
      name: annotationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceTokenId:
      name: serviceTokenId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceTokenGenerationPrecondition:
      name: X-Deployer-If-Credential-Generation
      in: header
      required: true
      description: credential_generation from the latest create, rotate, or active-metadata response. A stale generation returns precondition_failed without issuing another credential.
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    ExternalProjectId:
      name: externalProjectId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    ExternalDeploymentId:
      name: externalDeploymentId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Scoped to the stable service-token identity and operation; current and
        overlapping credentials created by rotation share the same issuer
        namespace. The completed status and body are retained for 24 hours.
        During that window an identical request replays them and reuse with a
        different canonical request hash returns idempotency_conflict. After
        expiry, the key may execute a new request.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    HostingJobId:
      name: hostingJobId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    HostingRecoveryId:
      name: hostingRecoveryId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    HostingRunnerId:
      name: hostingRunnerId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    LeaseGeneration:
      name: X-Deployer-Lease-Generation
      in: header
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    LeaseToken:
      name: X-Deployer-Lease-Token
      in: header
      required: true
      schema: {type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
    ManifestTimestamp:
      name: X-Deployer-Timestamp
      in: header
      required: true
      description: Unix timestamp in seconds; accepted within five minutes of server time.
      schema:
        type: string
        pattern: '^[0-9]+$'
    ManifestSignature:
      name: X-Deployer-Signature
      in: header
      required: true
      description: HMAC-SHA256 of timestamp, a period, and the exact raw request body, keyed with the service token.
      schema:
        type: string
        pattern: '^sha256=[a-fA-F0-9]{64}$'

  responses:
    Error:
      description: JSON error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error, code]
      allOf:
        - if:
            required: [cleanup_authorized]
            properties: {cleanup_authorized: {const: true}}
          then:
            required: [retained_releases]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable code; clients never parse error text.
          enum:
            - authentication_required
            - invalid_agent_token
            - service_token_required
            - invalid_service_token
            - service_token_not_found
            - insufficient_scope
            - precondition_required
            - precondition_failed
            - invalid_idempotency_key
            - idempotency_conflict
            - idempotency_in_progress
            - invalid_deployment
            - external_deployment_conflict
            - deployment_not_found
            - manifest_digest_mismatch
            - artifact_digest_mismatch
            - source_fetch_failed
            - secret_reference_unavailable
            - project_suspended
            - execution_disabled
            - runner_capacity_unavailable
            - release_not_found
            - release_not_healthy
            - proxy_unavailable
            - proxy_rejected
            - unsupported_media_type
            - manifest_signature_required
            - invalid_manifest_signature
            - manifest_signature_expired
            - invalid_manifest
            - provision_failed
            - csrf_required
            - forbidden
            - validation_error
            - method_not_allowed
            - not_found
            - conflict
            - runner_session_superseded
            - project_busy
            - build_not_running
            - build_cancel_failed
            - payload_too_large
            - internal_error
            - project_not_found
            - build_not_found
            - runner_not_found
            - job_not_found
            - job_forbidden
            - artifact_not_found
            - artifact_unavailable
            - artifact_unmanaged
            - artifact_too_large
            - snapshot_unavailable
            - snapshot_unmanaged
            - invalid_agent_completion
        cleanup_authorized:
          type: boolean
          description: Present and true only when this exact session ID was durably tombstoned during takeover and may reconcile its local runtimes against retained_releases.
        retained_releases:
          type: array
          description: Authoritative cleanup retention set returned with runner_session_superseded when cleanup_authorized is true.
          maxItems: 1024
          items: {$ref: "#/components/schemas/HostingRetainedRelease"}

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    BuildCreated:
      type: object
      required: [build_id]
      properties:
        build_id:
          type: integer
          format: int64

    ServiceTokenInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^(?!.*[\u0000-\u001F\u007F-\u009F])\S(?:.*\S)?$'
          description: Canonical display name without leading/trailing whitespace or control characters.
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [deployments:read, deployments:write, projects:write, 'hosting:admin']

    ServiceTokenMetadata:
      type: object
      additionalProperties: false
      required: [id, name, scopes, created_at, credential_generation]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^(?!.*[\u0000-\u001F\u007F-\u009F])\S(?:.*\S)?$'
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [deployments:read, deployments:write, projects:write, 'hosting:admin']
        credential_generation:
          type: integer
          format: int64
          minimum: 1
          description: Current credential identity sent in X-Deployer-If-Credential-Generation for rotation.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    ServiceTokenSecret:
      type: object
      additionalProperties: false
      required: [id, name, scopes, token, credential_generation, created_at]
      properties:
        id: {type: integer, format: int64}
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^(?!.*[\u0000-\u001F\u007F-\u009F])\S(?:.*\S)?$'
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [deployments:read, deployments:write, projects:write, 'hosting:admin']
        token:
          type: string
          readOnly: true
          pattern: '^dpl_[a-f0-9]{48}$'
          description: One-time secret returned only on creation or rotation; the response is marked no-store.
        credential_generation:
          type: integer
          format: int64
          minimum: 1
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}

    InternalProjectUpsertInput:
      type: object
      additionalProperties: false
      required: [manifest]
      properties:
        manifest:
          $ref: "#/components/schemas/HostingProjectManifest"

    HostingProjectManifest:
      type: object
      additionalProperties: false
      required: [schema_version, repository, runtime, resource_profile]
      properties:
        schema_version:
          type: string
          const: v1
        repository:
          type: object
          additionalProperties: false
          required: [installation_id, repository_id, full_name]
          properties:
            installation_id:
              type: integer
              format: int64
              minimum: 1
            repository_id:
              type: integer
              format: int64
              minimum: 1
            full_name:
              type: string
              pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
        runtime:
          oneOf:
            - $ref: "#/components/schemas/HostingStaticRuntime"
            - $ref: "#/components/schemas/HostingNodeRuntime"
        resource_profile:
          type: string
          enum: [starter, standard]

    HostingStaticRuntime:
      type: object
      additionalProperties: false
      required: [kind, node_version, package_manager, build_script, output_directory]
      properties:
        kind: {type: string, const: static}
        node_version: {type: string, enum: ['20', '22']}
        package_manager: {type: string, enum: [npm, pnpm, yarn]}
        build_script:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9:_-]{0,63}$'
          description: package.json script name, never a shell command.
        output_directory:
          type: string
          maxLength: 256
          pattern: '^(?!\.{1,2}(?:/|$))[A-Za-z0-9_.-]+(?:/(?!\.{1,2}(?:/|$))[A-Za-z0-9_.-]+)*$'
          description: Canonical relative path segments inside the repository; no whitespace, control characters, backslashes, or traversal.

    HostingNodeRuntime:
      type: object
      additionalProperties: false
      required: [kind, node_version, package_manager, start_script, port, health_path]
      properties:
        kind: {type: string, const: node}
        node_version: {type: string, enum: ['20', '22']}
        package_manager: {type: string, enum: [npm, pnpm, yarn]}
        build_script:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9:_-]{0,63}$'
          description: Optional package.json build script name, never a shell command.
        start_script:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9:_-]{0,63}$'
          description: Required package.json start script name, never a shell command.
        port: {type: integer, minimum: 1024, maximum: 65535}
        health_path:
          type: string
          pattern: "^/(?!/)(?:[A-Za-z0-9._~!$&'()*+,;=:@/-]|%[A-Fa-f0-9]{2})*$"
          description: Absolute HTTP path without a query, fragment, whitespace, or authority prefix.

    InternalProject:
      type: object
      required: [external_project_id, manifest_digest, manifest, created, replayed]
      properties:
        external_project_id: {$ref: "#/components/schemas/ExternalProjectId"}
        manifest_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        manifest:
          $ref: "#/components/schemas/HostingProjectManifest"
        created:
          type: boolean
        replayed:
          type: boolean

    SHA256Digest:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'

    HostingFailureCode:
      type: string
      description: Stable machine-readable hosting execution or recovery failure code.
      enum: [artifact_digest_mismatch, artifact_unavailable, build_failed, build_timeout, cancelled, health_check_failed, proxy_activation_failed, release_persistence_failed, runner_lost, runtime_start_failed, runtime_instance_lost, secret_reference_unavailable, source_fetch_failed, workload_policy_violation]

    ExternalProjectId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'

    ExternalDeploymentId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'

    HostingWorkloadLimits:
      type: object
      additionalProperties: false
      required: [cpu_millis, ram_bytes, disk_bytes, pids]
      properties:
        cpu_millis: {type: integer, format: int64, minimum: 1}
        ram_bytes: {type: integer, format: int64, minimum: 1}
        disk_bytes: {type: integer, format: int64, minimum: 1}
        pids: {type: integer, format: int64, minimum: 1}

    HostingSecretReference:
      type: object
      additionalProperties: false
      required: [provider, reference, expires_at]
      description: >
        Opaque control-plane secret identifier plus its application file name;
        never plaintext secret material. expires_at is admission freshness, not
        runtime authorization: each build or restore obtains a fresh lease-bound
        workload identity before redemption.
      properties:
        provider: {type: string, const: control-plane}
        reference:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^[A-Za-z0-9._:/-]+$'
        name:
          type: string
          description: >
            File name created below /run/secrets/deployer; unique within the
            request. New callers should always supply it. For compatibility
            with earlier v1 requests, an omitted value is normalized to
            SECRET_<one-based array index> before the canonical idempotency hash
            is computed.
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        expires_at:
          type: string
          format: date-time
          description: Admission reference expiry; must be in the future and no more than one hour from the request.

    HostingSourceReference:
      type: object
      additionalProperties: false
      required: [provider, reference, expires_at]
      description: >
        Opaque short-lived source-broker reference. It is redeemed only against
        Deployer's configured broker origin and is never persisted. The broker
        must permit identical redemptions until expiry so concurrent idempotent
        deployment requests can converge on the same immutable artifact.
      properties:
        provider: {type: string, const: control-plane}
        reference:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^[A-Za-z0-9._-]+$'
        expires_at:
          type: string
          format: date-time
          description: Must be in the future and no more than one hour from the request.

    HostingDeploymentInput:
      type: object
      additionalProperties: false
      description: >
        Before computing the canonical idempotency hash, Deployer normalizes
        secret-reference default names and all source/secret reference
        timestamps to UTC. During rolling upgrades it also recognizes the
        prior v1 hash for an otherwise exact request throughout the live
        24-hour idempotency window.
      required: [external_deployment_id, commit_sha, manifest_digest, artifact_digest, source_reference]
      properties:
        external_deployment_id: {$ref: "#/components/schemas/ExternalDeploymentId"}
        commit_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        manifest_digest: {$ref: "#/components/schemas/SHA256Digest"}
        artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        source_reference: {$ref: "#/components/schemas/HostingSourceReference"}
        secret_references:
          type: array
          maxItems: 64
          description: Runtime-only secrets; allowed only when the provisioned runtime kind is node.
          items: {$ref: "#/components/schemas/HostingSecretReference"}

    HostingDeployment:
      type: object
      required:
        - external_deployment_id
        - external_project_id
        - commit_sha
        - manifest_digest
        - artifact_digest
        - status
        - phase
        - callback_state
        - created_at
        - updated_at
        - log_reference
        - event_reference
      properties:
        external_deployment_id: {$ref: "#/components/schemas/ExternalDeploymentId"}
        external_project_id: {$ref: "#/components/schemas/ExternalProjectId"}
        commit_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        manifest_digest: {$ref: "#/components/schemas/SHA256Digest"}
        artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        status: {type: string, enum: [queued, running, active, failed, cancelled]}
        phase:
          type: string
          enum: [queued, fetching_source, building, starting_candidate, health_checking, activating, active, failed, cancelling, cancelled, rolling_back]
        failure_code:
          type: string
          enum: [artifact_digest_mismatch, artifact_unavailable, build_failed, build_timeout, cancelled, health_check_failed, proxy_activation_failed, release_persistence_failed, runner_lost, runtime_start_failed, secret_reference_unavailable, source_fetch_failed, workload_policy_violation]
        failure_message: {type: string, description: Redacted operator context; clients must use failure_code for logic.}
        release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        previous_release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        runtime_status:
          type: string
          enum: [available, checking, recovering, unavailable]
          description: checking is the durable grace period after a complete snapshot first omits or reports a non-running exact instance.
        runtime_failure_code:
          type: string
          enum: [artifact_digest_mismatch, artifact_unavailable, health_check_failed, proxy_activation_failed, release_persistence_failed, runner_lost, runtime_instance_lost, runtime_start_failed, secret_reference_unavailable, workload_policy_violation]
          description: Stable runtime/recovery cause; independent of the immutable original deployment failure_code.
        runtime_recovery_id:
          type: integer
          format: int64
          minimum: 1
          description: Latest recovery attempt for this immutable release, including terminal history.
        runtime_recovery_status:
          type: string
          enum: [queued, leased, running, succeeded, failed, cancelled]
          description: Status of runtime_recovery_id; terminal values remain available for polling reconciliation.
        callback_state: {type: string, enum: [pending, delivered, dead_letter]}
        cancel_requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        log_reference: {type: string}
        event_reference: {type: string}

    HostingRelease:
      type: object
      required: [digest, external_deployment_id, commit_sha, artifact_digest, status, created_at]
      properties:
        digest: {$ref: "#/components/schemas/SHA256Digest"}
        external_deployment_id: {$ref: "#/components/schemas/ExternalDeploymentId"}
        commit_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        status: {type: string, enum: [healthy, active, inactive, failed]}
        health_evidence: {type: object}
        route_revision: {type: string}
        previous_release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        created_at: {type: string, format: date-time}
        activated_at: {type: string, format: date-time}
        deactivated_at: {type: string, format: date-time}

    HostingRollbackRelease:
      allOf:
        - $ref: "#/components/schemas/HostingRelease"
        - type: object
          required: [status, route_revision, activated_at]
          properties:
            status: {type: string, const: active}
            route_revision: {type: string, minLength: 1}
            activated_at: {type: string, format: date-time}

    HostingEvent:
      type: object
      required: [id, event_type, phase, metadata, created_at]
      properties:
        id: {type: integer, format: int64}
        event_type:
          type: string
          description: >
            Stable structured event name. Runtime inventory transitions include
            runtime_instance_missing_observed, runtime_instance_loss_confirmed,
            runtime_recovery_queued, runtime_reappeared_before_recovery,
            runtime_recovered, inactive_runtime_runner_lost, and terminal
            runtime_recovery_failed/runtime_recovery_cancelled variants.
        phase: {type: string, enum: [queued, fetching_source, building, starting_candidate, health_checking, activating, active, failed, cancelling, cancelled, rolling_back]}
        failure_code: {$ref: "#/components/schemas/HostingFailureCode"}
        metadata: {type: object, description: Redacted structured metadata.}
        created_at: {type: string, format: date-time}

    HostingLog:
      type: object
      required: [id, stream, message, created_at]
      properties:
        id: {type: integer, format: int64}
        stream: {type: string, enum: [build, runtime, system]}
        message: {type: string, description: Redacted bounded log message.}
        created_at: {type: string, format: date-time}

    HostingLogInput:
      type: object
      additionalProperties: false
      required: [stream, message]
      properties:
        stream: {type: string, enum: [build, runtime, system]}
        message: {type: string, maxLength: 65536}

    HostingDesiredState:
      type: object
      required: [external_project_id, desired_state]
      properties:
        external_project_id: {$ref: "#/components/schemas/ExternalProjectId"}
        desired_state: {type: string, enum: [active, suspended]}

    KillSwitchInput:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: {type: boolean}
        reason: {type: string, minLength: 3, maxLength: 500, pattern: '^[^\u0000\r\n]+$'}

    KillSwitchState:
      type: object
      required: [scope, enabled, reason, updated_at]
      properties:
        scope: {type: string, enum: [global, project]}
        external_project_id: {$ref: "#/components/schemas/ExternalProjectId"}
        enabled: {type: boolean}
        reason: {type: string, description: Redacted audit reason.}
        updated_at: {type: string, format: date-time}

    Capacity:
      type: object
      required: [cpu_millis, ram_bytes, disk_bytes, pids]
      properties:
        cpu_millis: {type: integer, format: int64, minimum: 0}
        ram_bytes: {type: integer, format: int64, minimum: 0}
        disk_bytes: {type: integer, format: int64, minimum: 0}
        pids: {type: integer, format: int64, minimum: 0}

    HostingRunnerState:
      type: object
      required: [id, name, labels, protocol_version, manifest_versions, runtime_versions, operations, capacity, free, reserve, draining, status]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        labels: {type: array, items: {type: string}}
        protocol_version: {type: string, const: v1}
        manifest_versions: {type: array, items: {type: string}}
        runtime_versions: {type: array, items: {type: string, enum: ['20', '22']}}
        operations: {type: array, items: {type: string, enum: [build, restore, runtime-secrets-v1, runtime-inventory-v1]}}
        capacity: {$ref: "#/components/schemas/Capacity"}
        free: {$ref: "#/components/schemas/Capacity"}
        reserve: {$ref: "#/components/schemas/Capacity"}
        draining: {type: boolean}
        status: {type: string, enum: [online, offline]}
        last_seen: {type: string, format: date-time}

    HostingRunnerInput:
      type: object
      additionalProperties: false
      required: [name, labels, protocol_version, manifest_versions, runtime_versions, capacity, reserve]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        labels: {type: array, items: {type: string}}
        protocol_version: {type: string, const: v1}
        manifest_versions: {type: array, items: {type: string, const: v1}}
        runtime_versions: {type: array, items: {type: string, enum: ['20', '22']}}
        operations:
          type: array
          default: [build]
          items: {type: string, enum: [build, restore, runtime-secrets-v1, runtime-inventory-v1]}
        capacity: {$ref: "#/components/schemas/Capacity"}
        reserve: {$ref: "#/components/schemas/Capacity"}

    HostingRunnerAdmin:
      allOf:
        - $ref: "#/components/schemas/HostingRunnerInput"
        - type: object
          required: [id, draining, status, created_at]
          properties:
            id: {type: integer, format: int64}
            token: {type: string, readOnly: true, description: Returned only at creation.}
            draining: {type: boolean}
            status: {type: string, enum: [online, offline]}
            last_seen: {type: string, format: date-time}
            created_at: {type: string, format: date-time}

    HostingCapabilities:
      type: object
      required: [api_version, manifest_versions, runner_protocol_versions, node_versions, runtime_kinds, runner_operations, resource_profiles, failure_codes]
      properties:
        api_version: {type: string, const: v1}
        manifest_versions: {type: array, items: {type: string, const: v1}}
        runner_protocol_versions: {type: array, items: {type: string, const: v1}}
        node_versions: {type: array, items: {type: string, enum: ['20', '22']}}
        runtime_kinds: {type: array, items: {type: string, enum: [static, node]}}
        runner_operations: {type: array, items: {type: string, enum: [build, restore, runtime-secrets-v1, runtime-inventory-v1]}}
        resource_profiles:
          type: object
          additionalProperties: {$ref: "#/components/schemas/HostingWorkloadLimits"}
        failure_codes:
          type: array
          items: {$ref: "#/components/schemas/HostingFailureCode"}

    HostingHeartbeat:
      type: object
      additionalProperties: false
      required: [free, draining, protocol_version, manifest_versions, runtime_versions]
      allOf:
        - if:
            required: [operations]
            properties:
              operations:
                contains: {const: runtime-inventory-v1}
          then:
            required: [session_id, sequence, runtime_inventory]
          else:
            not:
              required: [runtime_inventory]
      properties:
        free: {$ref: "#/components/schemas/Capacity"}
        draining: {type: boolean}
        protocol_version: {type: string, const: v1}
        manifest_versions: {type: array, items: {type: string, const: v1}}
        runtime_versions: {type: array, items: {type: string, enum: ['20', '22']}}
        operations:
          type: array
          description: >
            Omitted by legacy v1 agents, which are treated as build-only.
            runtime-secrets-v1 is advertised only after the agent validates its
            fixed broker URL and isolated tmpfs namespace; secret-bearing build
            and restore work requires it. runtime-inventory-v1 makes session_id,
            sequence, and runtime_inventory mandatory and becomes sticky once
            accepted; legacy omission remains non-authoritative and is never
            interpreted as an empty snapshot.
          items: {type: string, enum: [build, restore, runtime-secrets-v1, runtime-inventory-v1]}
        session_id:
          type: string
          pattern: '^[a-f0-9]{48}$'
          description: >
            Random agent-boot identity required with runtime-inventory-v1. A
            different live session is rejected until the prior session is
            stale. On takeover, the former session ID is durably tombstoned and
            can never reclaim ownership. Its process receives an authenticated
            bounded retention set; a restarted former owner uses its 0600
            work-root session marker with the non-owning session-retention
            endpoint. It keeps retained runtimes through handoff, then removes
            unretained containers and secret material before exiting. An
            unaccepted replacement has no cleanup authority and waits without
            pruning inherited runtimes recorded in runtime-adoptions.json.
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: Strictly increasing within session_id; stale or replayed snapshots are rejected.
        runtime_inventory:
          type: array
          maxItems: 1024
          description: >
            Complete namespace-scoped Docker snapshot, required with
            runtime-inventory-v1. Omission means unsupported/non-authoritative;
            [] is an authoritative empty snapshot. The first accepted snapshot
            of a new session enrolls that session and records positive runtime
            observations, but does not prove inherited runtimes absent; absence
            proof begins with the next accepted same-session snapshot.
            Collection failure must suppress the heartbeat rather than send an
            empty array. The entire
            heartbeat body is limited to 512 KiB, entries must be unique by exact
            project/deployment/release/instance identity, and placement reserves
            inventory headroom below this protocol maximum.
          items: {$ref: "#/components/schemas/HostingObservedRuntime"}

    HostingObservedRuntime:
      type: object
      additionalProperties: false
      required: [release_digest, external_project_id, external_deployment_id, runtime_instance_id, state]
      properties:
        release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        external_project_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'}
        external_deployment_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'}
        runtime_instance_id:
          type: string
          pattern: '^(|(?:build|restore)-[1-9][0-9]*-[1-9][0-9]*)$'
          description: Empty only for an adopted pre-inventory legacy runtime; all generated runtimes use an exact build/restore lease instance.
        state: {type: string, enum: [created, restarting, running, removing, paused, exited, dead]}

    HostingHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [retained_releases]
      properties:
        retained_releases:
          type: array
          maxItems: 1024
          items: {$ref: "#/components/schemas/HostingRetainedRelease"}

    HostingRetainedRelease:
      type: object
      additionalProperties: false
      required: [release_digest, external_project_id, external_deployment_id, status]
      properties:
        release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        external_project_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'}
        external_deployment_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'}
        runtime_instance_id:
          type: string
          pattern: '^(build|restore)-[1-9][0-9]*-[1-9][0-9]*$'
          description: Required for inventory-capable agents; omission is retained only for pre-inventory legacy rows.
        status: {type: string, enum: [healthy, active, inactive]}

    HostingJobRecipe:
      oneOf:
        - $ref: "#/components/schemas/HostingBuildJobRecipe"
        - $ref: "#/components/schemas/HostingRestoreJobRecipe"

    HostingBuildJobRecipe:
      type: object
      additionalProperties: false
      required: [operation, schema_version, external_project_id, external_deployment_id, repository, commit_sha, manifest_digest, artifact_digest, runtime, limits, source_artifact_url]
      description: Platform-generated static/Node recipe. No customer Dockerfile, shell, Compose, privilege, mount, or host-port field exists.
      properties:
        operation: {type: string, const: build}
        schema_version: {type: string, const: v1}
        external_project_id: {$ref: "#/components/schemas/ExternalProjectId"}
        external_deployment_id: {$ref: "#/components/schemas/ExternalDeploymentId"}
        repository: {$ref: "#/components/schemas/HostingProjectManifest/properties/repository"}
        commit_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        manifest_digest: {$ref: "#/components/schemas/SHA256Digest"}
        artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        runtime: {$ref: "#/components/schemas/HostingProjectManifest/properties/runtime"}
        limits: {$ref: "#/components/schemas/HostingWorkloadLimits"}
        source_artifact_url: {type: string, pattern: '^/api/hosting-agent/v1/jobs/[1-9][0-9]*/source$'}

    HostingRestoreJobRecipe:
      type: object
      additionalProperties: false
      required: [operation, schema_version, external_project_id, external_deployment_id, runtime, limits, release_digest, release_artifact_digest, release_artifact_url]
      description: Lease-fenced restore of a previously persisted immutable release image; it performs no source fetch or customer build.
      properties:
        operation: {type: string, const: restore}
        schema_version: {type: string, const: v1}
        external_project_id: {$ref: "#/components/schemas/ExternalProjectId"}
        external_deployment_id: {$ref: "#/components/schemas/ExternalDeploymentId"}
        runtime: {$ref: "#/components/schemas/HostingProjectManifest/properties/runtime"}
        limits: {$ref: "#/components/schemas/HostingWorkloadLimits"}
        release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        release_artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        release_artifact_url: {type: string, pattern: '^/api/hosting-agent/v1/recoveries/[1-9][0-9]*/artifact$'}

    HostingClaimedJob:
      type: object
      required: [job_id, lease_generation, lease_token, lease_expires_at, recipe, secret_references]
      properties:
        job_id: {type: integer, format: int64}
        lease_generation: {type: integer, format: int64}
        lease_token: {type: string, readOnly: true, description: Returned only in a successful claim response.}
        lease_expires_at: {type: string, format: date-time}
        recipe: {$ref: "#/components/schemas/HostingJobRecipe"}
        secret_references:
          type: array
          items: {$ref: "#/components/schemas/HostingSecretReference"}

    HostingWorkloadIdentity:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          readOnly: true
          pattern: '^wli_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          description: >
            HMAC-SHA256 bearer token described by secret-broker-openapi.yaml;
            valid for at most 90 seconds and sensitive in transit and logs.
        expires_at: {type: string, format: date-time}

    HostingCompletion:
      type: object
      additionalProperties: false
      required: [status]
      oneOf:
        - required: [status, release_digest, release_artifact_digest, runtime_endpoint, health_evidence]
          properties:
            status: {type: string, const: success}
        - required: [status, failure_code]
          properties:
            status: {type: string, const: failed}
        - required: [status]
          properties:
            status: {type: string, const: cancelled}
      properties:
        status: {type: string, enum: [success, failed, cancelled]}
        failure_code:
          type: string
          enum: [artifact_digest_mismatch, artifact_unavailable, build_failed, build_timeout, cancelled, health_check_failed, proxy_activation_failed, release_persistence_failed, runner_lost, runtime_start_failed, secret_reference_unavailable, source_fetch_failed, workload_policy_violation]
        failure_message: {type: string}
        release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        release_artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        runtime_endpoint:
          type: string
          format: uri
          description: Private or loopback HTTP(S) endpoint only.
        health_evidence:
          type: object
          properties:
            healthy: {type: boolean}
            attempts: {type: number, minimum: 1, maximum: 100}
            status_code: {type: number}

    HostingRecoveryCompletion:
      type: object
      additionalProperties: false
      required: [status]
      oneOf:
        - required: [status, release_digest, release_artifact_digest, runtime_endpoint, health_evidence]
          properties:
            status: {type: string, const: success}
        - required: [status, failure_code]
          properties:
            status: {type: string, const: failed}
            failure_code:
              type: string
              enum: [artifact_digest_mismatch, artifact_unavailable, health_check_failed, proxy_activation_failed, release_persistence_failed, runner_lost, runtime_start_failed, secret_reference_unavailable, workload_policy_violation]
        - required: [status]
          properties:
            status: {type: string, const: cancelled}
            failure_code: {type: string, const: cancelled}
      properties:
        status: {type: string, enum: [success, failed, cancelled]}
        failure_code:
          type: string
          enum: [artifact_digest_mismatch, artifact_unavailable, cancelled, health_check_failed, proxy_activation_failed, release_persistence_failed, runner_lost, runtime_start_failed, secret_reference_unavailable, workload_policy_violation]
        failure_message: {type: string}
        release_digest: {$ref: "#/components/schemas/SHA256Digest"}
        release_artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        runtime_endpoint:
          type: string
          format: uri
          description: Private or loopback HTTP(S) endpoint only.
        health_evidence:
          type: object
          additionalProperties: true
          required: [healthy, attempts]
          properties:
            healthy: {type: boolean, const: true}
            attempts: {type: number, minimum: 1, maximum: 100}
            status_code: {type: number}

    HostingCallback:
      type: object
      required: [event_id, timestamp, external_project_id, external_deployment_id, phase, status, failure_code, artifact_digest, release_digest]
      properties:
        event_id: {type: string, pattern: '^evt_[a-f0-9]{32}$'}
        timestamp: {type: string, format: date-time}
        external_project_id: {$ref: "#/components/schemas/ExternalProjectId"}
        external_deployment_id: {$ref: "#/components/schemas/ExternalDeploymentId"}
        phase: {type: string}
        status: {type: string, enum: [active, failed, cancelled]}
        failure_code:
          oneOf:
            - {$ref: "#/components/schemas/HostingFailureCode"}
            - {type: string, const: ''}
        artifact_digest: {$ref: "#/components/schemas/SHA256Digest"}
        release_digest:
          oneOf:
            - {$ref: "#/components/schemas/SHA256Digest"}
            - {type: string, const: ''}

