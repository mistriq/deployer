            application/x-tar:
              schema: {type: string, format: binary}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/jobs/{hostingJobId}/heartbeat:
    post:
      tags: [hosting-agent]
      summary: Renew a current job lease and receive durable cancellation intent
      operationId: heartbeatHostingJob
      security: [{hostingAgentBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/HostingJobId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
      responses:
        "200":
          description: Lease state.
          content:
            application/json:
              schema:
                type: object
                required: [cancel_requested]
                properties:
                  cancel_requested: {type: boolean}
        "403": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/jobs/{hostingJobId}/workload-identity:
    post:
      tags: [hosting-agent]
      summary: Mint a short-lived secret-broker identity for the current job lease
      operationId: mintHostingJobWorkloadIdentity
      security: [{hostingAgentBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/HostingJobId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
      responses:
        "200":
          description: Non-cacheable identity bound to this lease and the exact secret-reference digest.
          headers:
            Cache-Control:
              required: true
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HostingWorkloadIdentity"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/jobs/{hostingJobId}/release-artifact:
    put:
      tags: [hosting-agent]
      summary: Persist the immutable Docker image archive produced by the current lease
      operationId: uploadHostingReleaseArtifact
      security: [{hostingAgentBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/HostingJobId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
        - name: X-Deployer-Release-Digest
          in: header
          required: true
          schema: {$ref: "#/components/schemas/SHA256Digest"}
        - name: X-Deployer-Artifact-Digest
          in: header
          required: true
          schema: {$ref: "#/components/schemas/SHA256Digest"}
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: {type: string, format: binary}
      responses:
        "204": {description: Content-addressed release artifact durably persisted or identical upload replayed.}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/jobs/{hostingJobId}/phase:
    post:
      tags: [hosting-agent]
      summary: Report a validated workload phase using a current lease
      operationId: reportHostingJobPhase
      security: [{hostingAgentBearerAuth: []}]
      parameters:
