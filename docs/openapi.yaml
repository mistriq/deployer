        - agentBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Docker image tar or files archive.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/agent/snapshot/{buildId}:
    post:
      tags: [agent]
      summary: Upload a snapshot archive for a build
      operationId: uploadAgentSnapshot
      security:
        - agentBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BuildId"
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        "200":
