            enum: [manual, snapshot]
        build_statuses:
          type: array
          items:
            type: string
            enum: [running, success, failed, cancelled]
        job_statuses:
          type: array
          items:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        error_codes:
