        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phase]
              properties:
                phase:
                  type: string
                  enum: [fetching_source, building, starting_candidate, health_checking]
      responses:
        "204": {description: Phase accepted.}
        "403": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/jobs/{hostingJobId}/logs:
    post:
      tags: [hosting-agent]
      summary: Persist a bounded redacted structured log chunk
      operationId: reportHostingJobLog
      security: [{hostingAgentBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/HostingJobId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HostingLogInput"}
      responses:
        "204": {description: Redacted log accepted.}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/jobs/{hostingJobId}/complete:
    post:
      tags: [hosting-agent]
      summary: Complete a lease with stable structured outcome and health evidence
      operationId: completeHostingJob
      security: [{hostingAgentBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/HostingJobId"
        - $ref: "#/components/parameters/LeaseGeneration"
        - $ref: "#/components/parameters/LeaseToken"
