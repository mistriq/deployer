        queue:
          type: object
          required: [queued_jobs, oldest_age_seconds]
          properties:
            queued_jobs: {type: integer}
            oldest_age_seconds: {type: number}
        deployments:
          type: object
          required: [terminal, successful, failed, cancelled, success_rate, average_duration_seconds]
          properties:
            terminal: {type: integer}
            successful: {type: integer}
            failed: {type: integer}
            cancelled: {type: integer}
            success_rate: {type: number, minimum: 0, maximum: 1}
            average_duration_seconds: {type: number}
        runners:
          type: object
          required: [online, offline, capacity, free, reserve]
          properties:
            online: {type: integer}
            offline: {type: integer}
            capacity: {$ref: "#/components/schemas/Capacity"}
            free: {$ref: "#/components/schemas/Capacity"}
            reserve: {$ref: "#/components/schemas/Capacity"}
        callbacks:
          type: object
          required: [pending, dead_letter, oldest_lag_seconds]
          properties:
            pending: {type: integer}
            dead_letter: {type: integer}
            oldest_lag_seconds: {type: number}

    Capabilities:
      type: object
      required:
