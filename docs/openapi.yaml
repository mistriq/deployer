      responses:
        "204": {description: Redacted recovery log accepted.}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}

  /api/hosting-agent/v1/recoveries/{hostingRecoveryId}/complete:
    post:
      tags: [hosting-agent]
      summary: Complete a runtime-recovery lease with retained identity and health evidence
      operationId: completeHostingRecovery
