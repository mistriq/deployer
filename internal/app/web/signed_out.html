<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark"><title>Signed out · Deployer</title><style>:root{--paper:#f1f2ef;--ink:#121412;--muted:#5f6560;--line:#d9dcd7}@media (prefers-color-scheme:dark){:root{--paper:#0c0d0c;--ink:#eceee9;--muted:#9a9f99;--line:#2c302c}}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{padding:2rem;max-width:26rem}.mark{display:flex;gap:3px;align-items:flex-end;height:18px;margin-bottom:2rem}.mark i{width:4px;background:var(--ink);border-radius:1px}.mark i:nth-child(1){height:45%}.mark i:nth-child(2){height:75%}.mark i:nth-child(3){height:55%}.mark i:nth-child(4){height:100%;background:#c6ea2f}h1{font-size:1.75rem;letter-spacing:-.025em;margin:0;font-weight:600}p{margin:.5rem 0 1.75rem;color:var(--muted)}a{display:inline-flex;align-items:center;min-height:44px;padding:0 1.1rem;background:var(--ink);color:var(--paper);font-weight:600;border-radius:8px;text-decoration:none}a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}</style></head>
<body><main class="signed-out"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h1>You’re signed out</h1><p>Your Deployer session has ended on this device.</p><a href="/">Sign in again</a></main></body>
